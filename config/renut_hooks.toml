# Disable Shadows: skip the caster draw in both shadow map passes. They are the
# only two passes that bind a null color target (depth-only). In each, the
# hooked address is `bl sub_823B0698` (draw caster) and the jump target is the
# loop decrement -- already the target of that pass's own "skip this caster"
# branches. The Clear-to-1.0 and Resolve still run, so the map resolves empty
# and nothing is shadowed.

# Per-viewport dynamic shadow map (sub_823B3598)
[[midasm_hook]]
address = 0x823B38B8
name = "disable_shadows"
registers = []
after_instruction = false
jump_address_on_true = 0x823B38BC

# Cached shadow map, 512 tile -> 2048 R16F atlas (sub_823B3CE0)
[[midasm_hook]]
address = 0x823B3EF4
name = "disable_shadows_cached"
registers = []
after_instruction = false
jump_address_on_true = 0x823B3EF8

# Force a full shadow atlas rebuild after disable_shadows is toggled, so stale
# tiles don't keep showing old shadows that drift with the camera.
# 0x821FF490 is `lwz r10, 0x8F8(r11)` -- the rebuild-all gate in the atlas
# scheduler (sub_821FF478). The hook runs after the load and overwrites r10, so
# the pass takes its own rebuild path and walks all 16 tiles.
[[midasm_hook]]
address = 0x821FF490
name = "shadows_atlas_rebuild"
registers = ["r10"]
after_instruction = true

# Disable Contact Shadows (CAO): skip the per-blob draw in the fxCAO pass
# (sub_82330088 -- SrcBlend=0/DestBlend=4 darkening under characters).
# 0x823302AC is `bl sub_82330388`; 0x823302B0 is the list-advance, already the
# target of the loop's own "skip this blob" branch. The pass still restores the
# blend/depth-bias state it saved, so nothing leaks into the rest of the frame.
[[midasm_hook]]
address = 0x823302AC
name = "disable_cao"
registers = []
after_instruction = false
jump_address_on_true = 0x823302B0

# Disable MSAA: zero only the MultiSample argument (r6) at the two scene
# render-target creations in sub_823ED2A8, so the color + depth surfaces are
# built single-sampled. Crucially this does NOT touch the MSAA-mode global
# (dword_82F9EC18), the tile count (sub_8222A990) or the surface dimensions
# (dword_82F9EBD0/D4) -- those still compute exactly as stock, so predicated
# tiling and every projection/viewport input are unchanged and matrices stay
# correct. Both surfaces must match sample count, so both calls are hooked.
# Takes effect on the next device reset (resolution change / restart).
# See disable_msaa_color()/disable_msaa_depth() in hooks.cpp.

# Color scene surface: bl D3DDevice_CreateSurface (r6 = MultiSample).
[[midasm_hook]]
address = 0x823ED594
name = "disable_msaa_color"
registers = ["r6"]
after_instruction = false

# Depth scene surface: bl D3DDevice_CreateSurface (r6 = MultiSample).
[[midasm_hook]]
address = 0x823ED6E4
name = "disable_msaa_depth"
registers = ["r6"]
after_instruction = false

# Fix the split-second black flash on heal/damage feedback. The a34-gated branch
# of the feedback overlay (sub_82573650) calls the glow/bloom pass sub_825740F0,
# which allocates a scratch surface at D3DSURFACE_PARAMETERS.Base = 0 -- aliased
# onto EDRAM tile 0, the main framebuffer -- and Clears it to black. On real
# Xenos that EDRAM is free (scene already resolved out); in the recomp it maps to
# the live framebuffer, so the clear blacks the whole frame for that effect's
# frame(s). 0x82573A54 is the first instruction of the glow block; jumping to
# 0x82573AC8 (the game's own "a34 == 0" merge point) drops only the glow and
# leaves the scene + the rest of the overlay intact. See disable_screen_glow().
[[midasm_hook]]
address = 0x82573A54
name = "disable_screen_glow"
registers = []
after_instruction = false
jump_address_on_true = 0x82573AC8

# Disable Motion Blur: skip the full-screen blur composite in the fxMotionBlur
# pass (sub_8229F440). 0x8229F8A0 is `bl D3DDevice_DrawVerticesUP` -- the
# RECTLIST fullscreen quad that mixes the current scene with the motion-blur
# history texture. 0x8229F8A4 is the state-restore that follows it, so skipping
# only the draw leaves the surrounding Resolves and render-state fixups intact;
# the scene simply passes through un-blurred.
[[midasm_hook]]
address = 0x8229F8A0
name = "disable_motion_blur"
registers = []
after_instruction = false
jump_address_on_true = 0x8229F8A4

# Disable Particles: cut the particle system at all three stages so it costs
# nothing rather than just being invisible. See hooks.cpp for the reasoning.
# Each hook skips one `bl` and lands on the instruction after it, leaving the
# list walks and the emitter-retire branch intact.

# Per-emitter CPU update + memexport sim draw (sub_82229748 -> sub_82226BD0).
# This is where the CPU saving comes from. 0x822297E8 advances the emitter list.
[[midasm_hook]]
address = 0x822297E4
name = "disable_particles_sim"
registers = []
after_instruction = false
jump_address_on_true = 0x822297E8

# Spawn/generation memexport pass (sub_82229748 -> sub_82229888).
# 0x8222985C advances the spawn list and is already the target of the loop's own
# "skip empty slot" branch.
[[midasm_hook]]
address = 0x82229858
name = "disable_particles_spawn"
registers = []
after_instruction = false
jump_address_on_true = 0x8222985C

# The four point-sprite draws in the render (sub_8222ADA0). Each address is
# `bl D3DDevice_DrawVertices`; it returns void and the next instruction reloads
# its own operands, so nothing depends on the call. Draws 0/1 are the predicated
# path, 2/3 the non-predicated one -- all four must be skipped.
[[midasm_hook]]
