# Hooked from config/renut_hooks.toml, same guest address as appMainDrawend
# below (0x82222250, appMainDraw's entry point) but never actually fires --
# rexglue's codegen only keeps the LAST-defined midasm_hook when two entries
# share an (address, after_instruction) pair, and this one differs from
# appMainDrawend only by after_instruction, so both coexist and this stays a
# documented no-op (see FPS.cpp).
[[midasm_hook]]
address = 0x82222250
name = "appMainDrawStart"
after_instruction = false

# appMainDraw's own entry point (config/renut_funcs.toml) -- fires once per
# real call into appMainDraw (~62% of real frames in practice, not fully
# understood why, but real and working). FPS.cpp's appMainDrawend() calls
# game_activity_stats::EndFrame() here, the only thing that refreshes the
# snapshot the Performance tab's "Game activity" section reads.
[[midasm_hook]]
address = 0x82222250
name = "appMainDrawend"
after_instruction = true

